    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;ai-history-chronological&quot; class=&quot;history-deck&quot; aria-label=&quot;Chronological AI History presentation&quot;&gt;
  &lt;style&gt;
    #ai-history-chronological {

      --deck-green: #7dff8a;

      width: 100%;
      color: var(--deck-ink);
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    }
    #ai-history-chronological * { box-sizing: border-box; }
    #ai-history-chronological h1,
    #ai-history-chronological h2,
    #ai-history-chronological h3,
    #ai-history-chronological p { margin-top: 0; }
    #ai-history-chronological h1 {
      margin-bottom: 20px;

    }
    #ai-history-chronological h2 {
      max-width: 900px;

      font-size: clamp(2rem, 4.2vw, 3.55rem);
      line-height: 1.03;
      letter-spacing: -.045em;
      font-weight: 500;
    }
    #ai-history-chronological h3 { margin-bottom: 10px; font-weight: 500; }
    #ai-history-chronological p,
    #ai-history-chronological li { line-height: 1.48; }
    #ai-history-chronological strong { font-weight: 500; }
    #ai-history-chronological .cyan { color: var(--deck-cyan); }
    #ai-history-chronological .green { color: var(--deck-green); }
    #ai-history-chronological .violet { color: var(--deck-violet); }
    #ai-history-chronological .amber { color: var(--deck-amber); }
    #ai-history-chronological .red { color: var(--deck-red); }
    #ai-history-chronological .muted { color: var(--deck-muted); }
    #ai-history-chronological .lead { max-width: 760px; color: var(--deck-muted); font-size: 1.1rem; }
    #ai-history-chronological .kicker {
      margin-bottom: 12px;
      color: var(--deck-cyan);
      text-transform: uppercase;
      letter-spacing: .17em;
      font-weight: 500;
    }
    #ai-history-chronological .stage {
      position: relative;
      width: 100%;
      min-height: 560px;
      overflow: hidden;
      border: 1px solid var(--deck-line);
      border-radius: 18px;
      background:
        radial-gradient(circle at 86% 12%, rgba(88,231,255,.12), transparent 28%),
        radial-gradient(circle at 8% 90%, rgba(125,255,138,.09), transparent 28%),
        linear-gradient(135deg, var(--deck-bg), var(--deck-bg-2));
      box-shadow: 0 22px 70px rgba(0,0,0,.34);
    }
    #ai-history-chronological .stage::before {
      content: &quot;&quot;;
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image:
        linear-gradient(rgba(88,231,255,.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(88,231,255,.14) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 88%);
    }
    #ai-history-chronological .slide {
      position: relative;
      z-index: 1;
      min-height: 560px;
      padding: 38px 46px 36px;
    }
    #ai-history-chronological .slide[hidden] { display: none; }
    #ai-history-chronological .slide-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: baseline;
    }
    #ai-history-chronological .year {
      flex: 0 0 auto;
      color: var(--deck-green);
      font-family: &quot;SFMono-Regular&quot;, Consolas, monospace;
      letter-spacing: .08em;
    }
    #ai-history-chronological .title-grid,
    #ai-history-chronological .two-col {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 42px;
      align-items: center;
    }
    #ai-history-chronological .title-grid { min-height: 470px; }
    #ai-history-chronological .author { margin-top: 34px; color: var(--deck-muted); }

    /* Cover: rules become a network */
    #ai-history-chronological .cover-visual {
      position: relative;
      min-height: 350px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
    }
    #ai-history-chronological .code-stack {
      padding: 18px;
      border-left: 2px solid var(--deck-cyan);
      color: var(--deck-cyan);
      background: rgba(88,231,255,.05);
      font-family: &quot;SFMono-Regular&quot;, Consolas, monospace;
      line-height: 1.65;
    }
    #ai-history-chronological .network-cluster { position: relative; min-height: 270px; }
    #ai-history-chronological .n-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--deck-green);
      box-shadow: 0 0 22px rgba(125,255,138,.65);
    }
    #ai-history-chronological .n-dot::after {
      content: &quot;&quot;;
      position: absolute;
      top: 8px;
      left: 14px;
      width: 90px;
      height: 1px;
      transform-origin: left;
      background: rgba(88,231,255,.5);

    #ai-history-chronological .n1 { top: 15%; left: 5%; }
    #ai-history-chronological .n1::after { transform: rotate(28deg); }
    #ai-history-chronological .n2 { top: 42%; left: 42%; background: var(--deck-cyan); }
    #ai-history-chronological .n2::after { width: 70px; transform: rotate(-34deg); }
    #ai-history-chronological .n3 { top: 72%; left: 8%; background: var(--deck-violet); }
    #ai-history-chronological .n3::after { transform: rotate(-25deg); }
    #ai-history-chronological .n4 { top: 18%; right: 4%; background: var(--deck-amber); }
    #ai-history-chronological .n4::after { display: none; }
    #ai-history-chronological .n5 { bottom: 12%; right: 7%; }
    #ai-history-chronological .n5::after { display: none; }

    /* Turing and the logical neuron */
    #ai-history-chronological .tape {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 24px 0 42px;
    }
    #ai-history-chronological .tape-cell {
      min-height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid var(--deck-line);
      font-family: &quot;SFMono-Regular&quot;, Consolas, monospace;
    }
    #ai-history-chronological .tape-cell.active {
      color: var(--deck-bg);
      background: var(--deck-cyan);
      border-color: transparent;
    }
    #ai-history-chronological .question {
      padding-left: 22px;
      border-left: 3px solid var(--deck-green);
      font-size: clamp(1.8rem, 4vw, 3.4rem);
      line-height: 1.06;
      letter-spacing: -.035em;
      font-weight: 500;
    }
    #ai-history-chronological .logic-neuron {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 30px 0;
    }
    #ai-history-chronological .logic-inputs { display: grid; gap: 22px; }
    #ai-history-chronological .circle {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border: 1px solid var(--deck-line);
      border-radius: 50%;
      background: rgba(255,255,255,.03);
    }
    #ai-history-chronological .circle.main {
      width: 94px;
      height: 94px;
      color: var(--deck-bg);
      background: var(--deck-green);
      border: 0;
      box-shadow: 0 0 28px rgba(125,255,138,.3);
    }
    #ai-history-chronological .arrow-line { position: relative; height: 1px; background: var(--deck-cyan); }
    #ai-history-chronological .arrow-line::after {
      content: &quot;&quot;;
      position: absolute;
      right: -1px;
      top: -4px;
      border-left: 7px solid var(--deck-cyan);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
    }
    #ai-history-chronological .truth-mini {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      max-width: 280px;

      border-left: 1px solid var(--deck-line);

    #ai-history-chronological .truth-mini span {

    /* SNARC */
    #ai-history-chronological .snarc-visual {

      gap: 28px;

    #ai-history-chronological .tube-bank {

    /* Dartmouth */
    #ai-history-chronological .field-map {

    #ai-history-chronological .field-core {

    #ai-history-chronological .ft3 { bottom: 7%; left: 8%; border-color: var(--deck-amber); }
    #ai-history-chronological .ft4 { bottom: 7%; right: 7%; border-color: var(--deck-cyan); }
    #ai-history-chronological .people-grid {

    #ai-history-chronological .milestone-lanes {

    #ai-history-chronological .dial {

    #ai-history-chronological .loss-line {

      border-radius: 0 0 80% 10%;

    /* Moore */
    #ai-history-chronological .compute-chart {
      position: relative;
      min-height: 330px;
      border-left: 1px solid var(--deck-line);
      border-bottom: 1px solid var(--deck-line);
      background-image:
        linear-gradient(rgba(143,175,207,.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(143,175,207,.09) 1px, transparent 1px);
      background-size: 25% 25%;
    }
    #ai-history-chronological .compute-curve {
      position: absolute;
      left: 7%; bottom: 8%; width: 84%; height: 78%;
      border-left: 5px solid var(--deck-green);

  &lt;div class=&quot;stage&quot; aria-live=&quot;polite&quot;&gt;
    &lt;section class=&quot;slide&quot; data-title=&quot;AI History&quot; data-year=&quot;1936 → today&quot;&gt;
      &lt;div class=&quot;title-grid&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;kicker&quot;&gt;Artificial Intelligence&lt;/div&gt;
          &lt;h1&gt;AI History:&lt;br&gt;&lt;span class=&quot;green&quot;&gt;From Rules to Learning&lt;/span&gt;&lt;/h1&gt;
          &lt;p class=&quot;lead&quot;&gt;How did we move from manually programming every rule to building machines that discover patterns for themselves?&lt;/p&gt;
          &lt;p class=&quot;author&quot;&gt;Adrián Tavera Aquino · Irvine Systems&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cover-visual&quot; aria-hidden=&quot;true&quot;&gt;
          &lt;div class=&quot;code-stack&quot;&gt;IF state = known&lt;br&gt;THEN apply(rule)&lt;br&gt;ELSE fail()&lt;/div&gt;
          &lt;div class=&quot;network-cluster&quot;&gt;
            &lt;span class=&quot;n-dot n1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n-dot n2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n-dot n3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n-dot n4&quot;&gt;&lt;/span&gt;&lt;span class=&quot;n-dot n5&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Universal computation&quot; data-year=&quot;1936&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;The computational foundation&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1936&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;Turing separated the machine from the task&lt;/h2&gt;
          &lt;p&gt;&lt;strong&gt;Alan Turing&lt;/strong&gt; described a universal mathematical machine capable of executing any computable algorithm encoded as instructions.&lt;/p&gt;
          &lt;div class=&quot;tape&quot; aria-label=&quot;Conceptual Turing machine tape&quot;&gt;&lt;span class=&quot;tape-cell&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;tape-cell&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;tape-cell active&quot;&gt;▶&lt;/span&gt;&lt;span class=&quot;tape-cell&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;tape-cell&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;tape-cell&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;tape-cell&quot;&gt;□&lt;/span&gt;&lt;/div&gt;
          &lt;p class=&quot;lead&quot;&gt;The machine was no longer defined by one task. Its instructions could define the task.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;kicker&quot;&gt;One machine · many programs&lt;/div&gt;
          &lt;div class=&quot;code-stack&quot;&gt;PROGRAM A → arithmetic&lt;br&gt;PROGRAM B → symbols&lt;br&gt;PROGRAM C → search&lt;br&gt;PROGRAM ? → intelligence&lt;/div&gt;
          &lt;p class=&quot;muted&quot;&gt;Universal computation created the conceptual space for AI: intelligent behavior could become another program a general machine might execute.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;The logical neuron&quot; data-year=&quot;1943&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;A bridge from biology to logic&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1943&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;McCulloch and Pitts turned a neuron into mathematics&lt;/h2&gt;
          &lt;p&gt;&lt;strong&gt;Warren McCulloch&lt;/strong&gt; and &lt;strong&gt;Walter Pitts&lt;/strong&gt; modeled a neuron as a simple threshold unit: combine binary inputs and fire when activation crosses a limit.&lt;/p&gt;
          &lt;p class=&quot;lead&quot;&gt;Networks of these units could represent logical expressions—suggesting that cognition might emerge from connected computation.&lt;/p&gt;
          &lt;p class=&quot;muted&quot;&gt;Their paper later inspired Marvin Minsky to build a learning machine in hardware.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;logic-neuron&quot; aria-label=&quot;Two binary inputs enter a threshold neuron and produce one output&quot;&gt;
            &lt;div class=&quot;logic-inputs&quot;&gt;&lt;div class=&quot;circle&quot;&gt;x₁&lt;/div&gt;&lt;div class=&quot;circle&quot;&gt;x₂&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;arrow-line&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;circle main&quot;&gt;Σ ≥ θ&lt;/div&gt;
            &lt;div class=&quot;arrow-line output-wire&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;circle logic-output&quot;&gt;y&lt;/div&gt;
          &lt;/div&gt;
          &lt;p class=&quot;cyan&quot;&gt;&lt;strong&gt;Example: AND gate&lt;/strong&gt;&lt;/p&gt;
          &lt;div class=&quot;truth-mini&quot; aria-label=&quot;AND truth table&quot;&gt;&lt;span&gt;x₁&lt;/span&gt;&lt;span&gt;x₂&lt;/span&gt;&lt;span&gt;y&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;span&gt;1&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Turing&#x27;s question&quot; data-year=&quot;1950&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Computation meets intelligence&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1950&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;Turing asked how intelligent behavior could be tested&lt;/h2&gt;
          &lt;p&gt;In &lt;em&gt;Computing Machinery and Intelligence&lt;/em&gt;, Turing avoided trying to define consciousness directly.&lt;/p&gt;
          &lt;p class=&quot;lead&quot;&gt;Instead, the &lt;strong&gt;Imitation Game&lt;/strong&gt; evaluated whether a machine could sustain a text conversation whose responses were indistinguishable from a human’s.&lt;/p&gt;
          &lt;p&gt;&lt;strong&gt;Alan Turing&lt;/strong&gt; · mathematician and pioneer of theoretical computer science&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;year cyan&quot;&gt;Computing Machinery and Intelligence&lt;/div&gt;
          &lt;div class=&quot;question&quot;&gt;“Can machines think?”&lt;/div&gt;
          &lt;p class=&quot;muted&quot;&gt;The question shifted machines from calculators toward potential cognitive systems—and turned intelligence into observable behavior.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;SNARC learns&quot; data-year=&quot;1951&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Before AI had a name&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1951&lt;/div&gt;&lt;/div&gt;
      &lt;h2&gt;Minsky and Edmonds built a machine that learned&lt;/h2&gt;
      &lt;div class=&quot;snarc-visual&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;tube-bank&quot; aria-label=&quot;Stylized bank of vacuum-tube components&quot;&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tube&quot;&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;p class=&quot;muted&quot;&gt;SNARC was a physical analog machine assembled from vacuum tubes, motors, clutches, and adjustable potentiometers.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;maze&quot; aria-label=&quot;A virtual rat follows a reinforced path through a maze&quot;&gt;
            &lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;&lt;span class=&quot;maze-cell&quot;&gt;&lt;/span&gt;
            &lt;div class=&quot;maze-path&quot;&gt;&lt;/div&gt;&lt;div class=&quot;rat&quot;&gt;R&lt;/div&gt;&lt;div class=&quot;reward&quot;&gt;+&lt;/div&gt;
          &lt;/div&gt;
          &lt;p&gt;&lt;strong&gt;Marvin Minsky &amp; Dean Edmonds&lt;/strong&gt;&lt;/p&gt;
          &lt;p class=&quot;lead&quot;&gt;Reward changed transmission probabilities, allowing a simulated rat to improve its path through a maze.&lt;/p&gt;
          &lt;p class=&quot;amber&quot;&gt;Probabilistic reinforcement—not gradient descent or backpropagation.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Dartmouth&quot; data-year=&quot;1956&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;A research program gets a name&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1956&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;Artificial intelligence becomes a field&lt;/h2&gt;
          &lt;p&gt;The Dartmouth Summer Research Project brought together researchers around a bold conjecture: aspects of learning and intelligence could be described precisely enough for machines to simulate them.&lt;/p&gt;
          &lt;div class=&quot;people-grid&quot;&gt;
            &lt;div class=&quot;person&quot;&gt;&lt;strong&gt;John McCarthy&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;Coined “artificial intelligence”&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;person&quot;&gt;&lt;strong&gt;Marvin Minsky&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;Neural learning and cognition&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;person&quot;&gt;&lt;strong&gt;Claude Shannon&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;Information and machine chess&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;person&quot;&gt;&lt;strong&gt;Nathaniel Rochester&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;IBM computing and AI research&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;field-map&quot; aria-label=&quot;AI connects learning, language, abstraction, and perception&quot;&gt;
          &lt;div class=&quot;field-topic ft1&quot;&gt;Learning&lt;/div&gt;&lt;div class=&quot;field-topic ft2&quot;&gt;Language&lt;/div&gt;&lt;div class=&quot;field-topic ft3&quot;&gt;Abstraction&lt;/div&gt;&lt;div class=&quot;field-topic ft4&quot;&gt;Perception&lt;/div&gt;
          &lt;div class=&quot;field-core&quot;&gt;ARTIFICIAL&lt;br&gt;INTELLIGENCE&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Trainable machines&quot; data-year=&quot;1957 → 1960&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Learning moves into real machines&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1957 → 1960&lt;/div&gt;&lt;/div&gt;
      &lt;h2&gt;Early systems learned—and searched—in different ways&lt;/h2&gt;
      &lt;div class=&quot;milestone-lanes&quot;&gt;
        &lt;div class=&quot;milestone&quot;&gt;
          &lt;div class=&quot;year cyan&quot;&gt;1957&lt;/div&gt;&lt;h3&gt;Bernstein chess program&lt;/h3&gt;
          &lt;div class=&quot;chess-board&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;p&gt;&lt;strong&gt;Alex Bernstein&lt;/strong&gt; and colleagues built the first complete chess program on an IBM 704.&lt;/p&gt;
          &lt;p class=&quot;muted&quot;&gt;Hard-coded search · roughly eight minutes per move&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;milestone&quot;&gt;
          &lt;div class=&quot;year green&quot;&gt;1957 / 1958&lt;/div&gt;&lt;h3&gt;Rosenblatt’s perceptron&lt;/h3&gt;
          &lt;div class=&quot;machine-panel&quot; aria-label=&quot;Physical perceptron control panel&quot;&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;span class=&quot;dial&quot;&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;p&gt;&lt;strong&gt;Frank Rosenblatt&lt;/strong&gt; introduced a trainable linear classifier; the later Mark I implementation was a large physical machine with cables and adjustable connections.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;milestone&quot;&gt;
          &lt;div class=&quot;year violet&quot;&gt;1960&lt;/div&gt;&lt;h3&gt;ADALINE + LMS&lt;/h3&gt;
          &lt;div class=&quot;loss-line&quot; aria-label=&quot;Error decreases as continuously adjustable weights are updated&quot;&gt;&lt;/div&gt;
          &lt;p&gt;&lt;strong&gt;Bernard Widrow &amp; Marcian Hoff&lt;/strong&gt; used the least-mean-squares rule to minimize continuous prediction error.&lt;/p&gt;
          &lt;p class=&quot;muted&quot;&gt;Learning became an optimization problem.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Moore&#x27;s Law&quot; data-year=&quot;1965&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;The hardware background&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1965&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;Compute begins its exponential climb&lt;/h2&gt;
          &lt;p&gt;&lt;strong&gt;Gordon Moore&lt;/strong&gt; observed that the number of components on integrated circuits was increasing exponentially.&lt;/p&gt;
          &lt;p class=&quot;lead&quot;&gt;For decades, more transistors meant faster processors, more memory, and increasingly practical experiments.&lt;/p&gt;
          &lt;p class=&quot;amber&quot;&gt;Better algorithms still mattered—but hardware continually expanded what those algorithms could attempt.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;compute-chart&quot; aria-label=&quot;Conceptual exponential growth in transistor density over time&quot;&gt;
          &lt;div class=&quot;compute-curve&quot;&gt;&lt;/div&gt;&lt;span class=&quot;chart-label y&quot;&gt;transistor density&lt;/span&gt;&lt;span class=&quot;chart-label x&quot;&gt;time&lt;/span&gt;&lt;span class=&quot;doubling-note&quot;&gt;≈ doubles every 2 years&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Builder to critic&quot; data-year=&quot;1969&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Eighteen years after SNARC&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1969&lt;/div&gt;&lt;/div&gt;
      &lt;h2&gt;The builder became the critic&lt;/h2&gt;
      &lt;div class=&quot;character-arc&quot;&gt;
        &lt;div class=&quot;character-side&quot;&gt;
          &lt;div class=&quot;character-year green&quot;&gt;Earlier · 1951&lt;/div&gt;&lt;h3&gt;SNARC proves adaptation is possible&lt;/h3&gt;
          &lt;p&gt;Minsky and Edmonds built a physical network that changed its behavior through reinforcement.&lt;/p&gt;
          &lt;p class=&quot;muted&quot;&gt;Question: &lt;em&gt;Can a machine learn at all?&lt;/em&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;arc-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;character-side&quot;&gt;
          &lt;div class=&quot;character-year amber&quot;&gt;1969&lt;/div&gt;&lt;h3&gt;&lt;em&gt;Perceptrons&lt;/em&gt; defines the ceiling&lt;/h3&gt;
          &lt;div class=&quot;book-shape&quot;&gt;PERCEPTRONS&lt;br&gt;&lt;small&gt;Marvin Minsky&lt;br&gt;Seymour Papert&lt;/small&gt;&lt;/div&gt;
          &lt;p&gt;Minsky and &lt;strong&gt;Seymour Papert&lt;/strong&gt; rigorously analyzed what important classes of perceptrons could and could not represent.&lt;/p&gt;
          &lt;p class=&quot;muted&quot;&gt;New question: &lt;em&gt;What can this kind of machine learn?&lt;/em&gt;&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;XOR&quot; data-year=&quot;1969&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;The decisive geometric example&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1969&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;xor-layout&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;XOR revealed the missing layer&lt;/h2&gt;
          &lt;p&gt;A single perceptron creates one linear decision boundary. XOR places equal outputs on opposite corners, so no single line can separate the classes.&lt;/p&gt;
          &lt;div class=&quot;xor-controls&quot; aria-label=&quot;Choose network depth&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-primary xor-mode&quot; data-mode=&quot;single&quot; aria-pressed=&quot;true&quot;&gt;Single neuron&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn xor-mode&quot; data-mode=&quot;hidden&quot; aria-pressed=&quot;false&quot;&gt;Hidden layer&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;xor-status&quot; aria-live=&quot;polite&quot;&gt;One boundary always leaves at least one point on the wrong side.&lt;/div&gt;
          &lt;div class=&quot;mini-mlp&quot; aria-label=&quot;A two-input network with two hidden units and one output&quot;&gt;
            &lt;div class=&quot;mini-layer&quot;&gt;&lt;span class=&quot;mini-node&quot;&gt;x₁&lt;/span&gt;&lt;span class=&quot;mini-node&quot;&gt;x₂&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arrow-line&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;mini-layer hidden&quot;&gt;&lt;span class=&quot;mini-node&quot;&gt;h₁&lt;/span&gt;&lt;span class=&quot;mini-node&quot;&gt;h₂&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arrow-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mini-node&quot;&gt;ŷ&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;xor-figure&quot; data-mode=&quot;single&quot;&gt;
          &lt;div class=&quot;xor-plane&quot; aria-label=&quot;XOR points with decision boundaries&quot;&gt;
            &lt;span class=&quot;xor-point zero p00&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;xor-point p01&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;xor-point p10&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;xor-point zero p11&quot;&gt;0&lt;/span&gt;
            &lt;span class=&quot;boundary single&quot;&gt;&lt;/span&gt;&lt;span class=&quot;boundary hidden-a&quot;&gt;&lt;/span&gt;&lt;span class=&quot;boundary hidden-b&quot;&gt;&lt;/span&gt;
          &lt;/div&gt;
          &lt;p class=&quot;muted&quot;&gt;Two hidden units can construct two boundaries, creating the nonlinear region a single neuron cannot express.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;First AI winter&quot; data-year=&quot;1973 → 1980&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Expectations meet available technology&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1973 → 1980&lt;/div&gt;&lt;/div&gt;
      &lt;h2&gt;The field cooled—but an important seed survived&lt;/h2&gt;
      &lt;div class=&quot;winter-line&quot;&gt;
        &lt;div class=&quot;winter-event&quot;&gt;&lt;div class=&quot;year cyan&quot;&gt;1973&lt;/div&gt;&lt;h3&gt;Lighthill Report&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;James Lighthill&lt;/strong&gt; criticized AI’s limited progress, contributing to reduced UK support.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;winter-event&quot;&gt;&lt;div class=&quot;year red&quot;&gt;1974–1980&lt;/div&gt;&lt;h3&gt;First AI winter&lt;/h3&gt;&lt;p&gt;Funding and confidence fell as machine translation, perception, and general reasoning missed ambitious expectations.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;winter-event&quot;&gt;&lt;div class=&quot;seed&quot;&gt;∂&lt;/div&gt;&lt;div class=&quot;year violet&quot;&gt;1974&lt;/div&gt;&lt;h3&gt;Werbos’s seed&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Paul Werbos&lt;/strong&gt; described how derivatives could propagate backward through layered systems.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;winter-event&quot;&gt;&lt;div class=&quot;year green&quot;&gt;Still active&lt;/div&gt;&lt;h3&gt;No total “dark age”&lt;/h3&gt;&lt;p&gt;Symbolic AI and some neural-network research continued despite lower support.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;The missing idea existed before the field had enough evidence, compute, or attention to make it dominant.&lt;/p&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Backpropagation&quot; data-year=&quot;1986&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;The connectionist revival&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1986&lt;/div&gt;&lt;/div&gt;
      &lt;h2&gt;Backpropagation made hidden layers trainable&lt;/h2&gt;
      &lt;div class=&quot;backprop-flow&quot; aria-label=&quot;The four-step backpropagation learning loop&quot;&gt;
        &lt;div class=&quot;bp-step&quot;&gt;&lt;strong&gt;1 · Forward&lt;/strong&gt;&lt;p class=&quot;muted&quot;&gt;Compute a prediction through all layers.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;bp-step&quot;&gt;&lt;strong&gt;2 · Loss&lt;/strong&gt;&lt;p class=&quot;muted&quot;&gt;Measure how far the output is from the target.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;bp-step&quot;&gt;&lt;strong&gt;3 · Backward&lt;/strong&gt;&lt;p class=&quot;muted&quot;&gt;Use the chain rule to calculate each weight’s responsibility.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;bp-step&quot;&gt;&lt;strong&gt;4 · Update&lt;/strong&gt;&lt;p class=&quot;muted&quot;&gt;Move weights in the direction that reduces error.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;gradient-return&quot;&gt;error gradients flow backward; information flows forward&lt;/div&gt;
      &lt;p&gt;&lt;strong&gt;David Rumelhart, Geoffrey Hinton, and Ronald Williams&lt;/strong&gt; demonstrated how internal hidden units could learn useful representations.&lt;/p&gt;
      &lt;p class=&quot;lead&quot;&gt;The exact architecture that XOR required finally had a practical learning procedure.&lt;/p&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Deep Blue&quot; data-year=&quot;1987 → 1997&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Symbolic AI reaches a public peak&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;1987 → 1997&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;Search conquered chess without learning intuition&lt;/h2&gt;
          &lt;div class=&quot;period-track&quot;&gt;
            &lt;div class=&quot;period&quot;&gt;&lt;strong&gt;1987–1993&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;A second AI winter follows the expert-system market collapse.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;period&quot;&gt;&lt;strong&gt;1996&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;Kasparov wins the first six-game match 4–2.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;period&quot;&gt;&lt;strong&gt;1997&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;Deep Blue wins the rematch 3½–2½.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;p&gt;&lt;strong&gt;Feng-hsiung Hsu, Murray Campbell, Joe Hoane, C. J. Tan&lt;/strong&gt; and the IBM team combined specialized hardware, search, databases, and human-designed evaluation.&lt;/p&gt;
          &lt;div class=&quot;metric-big&quot;&gt;200M positions/sec&lt;/div&gt;
          &lt;p class=&quot;muted&quot;&gt;Opponent: world champion Garry Kasparov&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;search-tree&quot; aria-label=&quot;Deep Blue expands a large search tree of candidate chess moves&quot;&gt;
          &lt;div class=&quot;tree-level&quot;&gt;&lt;div class=&quot;tree-node&quot;&gt;position&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;tree-level&quot;&gt;&lt;div class=&quot;tree-node&quot;&gt;move A&lt;/div&gt;&lt;div class=&quot;tree-node&quot;&gt;move B&lt;/div&gt;&lt;div class=&quot;tree-node&quot;&gt;move C&lt;/div&gt;&lt;/div&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Three ingredients&quot; data-year=&quot;2006 → 2011&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;The conditions for deep learning&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;2006 → 2011&lt;/div&gt;&lt;/div&gt;
      &lt;h2&gt;Data, algorithms, and compute converged&lt;/h2&gt;
      &lt;div class=&quot;convergence&quot;&gt;
        &lt;div class=&quot;stream&quot;&gt;&lt;div class=&quot;stream-year cyan&quot;&gt;ALGORITHMS · 2006&lt;/div&gt;&lt;h3&gt;Layer-wise pretraining&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Geoffrey Hinton, Simon Osindero, and Yee-Whye Teh&lt;/strong&gt; showed how deep belief networks could be trained layer by layer.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;ReLU and improved training techniques followed.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;stream&quot;&gt;&lt;div class=&quot;stream-year green&quot;&gt;DATA · 2009&lt;/div&gt;&lt;h3&gt;ImageNet&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Fei-Fei Li&lt;/strong&gt; and the ImageNet team organized millions of labeled images across thousands of categories.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Learning could now be tested at unprecedented scale.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;stream&quot;&gt;&lt;div class=&quot;stream-year violet&quot;&gt;COMPUTE&lt;/div&gt;&lt;h3&gt;GPU parallelism&lt;/h3&gt;&lt;p&gt;Graphics processors performed many matrix operations simultaneously.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Moore’s long hardware curve met massively parallel computation.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;merge-line&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
      &lt;p class=&quot;lead&quot;&gt;None of the three was sufficient alone. Together, they changed what could be trained.&lt;/p&gt;
    &lt;/section&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;AlexNet&quot; data-year=&quot;2012&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;The ImageNet moment&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;2012&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;two-col&quot;&gt;
        &lt;div&gt;
          &lt;h2&gt;AlexNet changed computer vision&lt;/h2&gt;
          &lt;p&gt;&lt;strong&gt;Alex Krizhevsky, Ilya Sutskever, and Geoffrey Hinton&lt;/strong&gt; trained a deep convolutional neural network on gaming GPUs.&lt;/p&gt;
          &lt;p class=&quot;lead&quot;&gt;Instead of manually designing every visual feature, the network learned a hierarchy directly from examples.&lt;/p&gt;
          &lt;div class=&quot;alex-metrics&quot;&gt;&lt;span&gt;&lt;strong class=&quot;cyan&quot;&gt;1M+&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;labeled images&lt;/span&gt;&lt;/span&gt;&lt;span&gt;&lt;strong class=&quot;green&quot;&gt;60M&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;parameters&lt;/span&gt;&lt;/span&gt;&lt;span&gt;&lt;strong class=&quot;violet&quot;&gt;2 GPUs&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;muted&quot;&gt;parallel training&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;p class=&quot;amber&quot;&gt;Result: deep learning became the dominant approach in computer vision.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;alexnet-stack&quot; aria-label=&quot;A convolutional network learns increasingly abstract features&quot;&gt;
          &lt;div class=&quot;feature-layer&quot;&gt;pixels&lt;/div&gt;&lt;div class=&quot;feature-layer&quot;&gt;edges&lt;/div&gt;&lt;div class=&quot;feature-layer&quot;&gt;textures &amp; parts&lt;/div&gt;&lt;div class=&quot;feature-layer&quot;&gt;object class&lt;/div&gt;

    &lt;section class=&quot;slide&quot; data-title=&quot;Attention and self-play&quot; data-year=&quot;2017&quot; hidden&gt;
      &lt;div class=&quot;slide-head&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;Two demonstrations of learned structure&lt;/div&gt;&lt;div class=&quot;year&quot;&gt;2017&lt;/div&gt;&lt;/div&gt;
      &lt;h2&gt;Learning scales to language and strategy&lt;/h2&gt;
      &lt;div class=&quot;dual-breakthrough&quot;&gt;
        &lt;div&gt;
          &lt;h3 class=&quot;cyan&quot;&gt;Transformer · Attention Is All You Need&lt;/h3&gt;
          &lt;div class=&quot;attention-row&quot; aria-label=&quot;Tokens relate to one another through self-attention&quot;&gt;&lt;span class=&quot;token&quot;&gt;each&lt;/span&gt;&lt;span class=&quot;token&quot;&gt;token&lt;/span&gt;&lt;span class=&quot;token&quot;&gt;weighs&lt;/span&gt;&lt;span class=&quot;token&quot;&gt;context&lt;/span&gt;&lt;/div&gt;
          &lt;p&gt;Self-attention relates every token to other relevant tokens and enables parallel processing during training.&lt;/p&gt;
          &lt;p class=&quot;muted&quot;&gt;&lt;strong&gt;Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit, Llion Jones, Aidan N. Gomez, Łukasz Kaiser, Illia Polosukhin&lt;/strong&gt;&lt;/p&gt;

        &lt;div class=&quot;dual-divider&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;h3 class=&quot;green&quot;&gt;AlphaZero · learned chess from self-play&lt;/h3&gt;
          &lt;div class=&quot;self-play&quot; aria-label=&quot;Self-play creates experience that improves the policy and value network&quot;&gt;&lt;div class=&quot;play-ring&quot;&gt;&lt;/div&gt;&lt;div class=&quot;play-core&quot;&gt;PLAY&lt;br&gt;LEARN&lt;br&gt;REPEAT&lt;/div&gt;&lt;/div&gt;
          &lt;p&gt;&lt;strong&gt;David Silver and the DeepMind team&lt;/strong&gt; combined neural policy/value networks with tree search.&lt;/p&gt;
          &lt;p class=&quot;muted&quot;&gt;Unlike Deep Blue, its evaluation was learned from self-play rather than built from chess expertise.&lt;/p&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ai-history-chronological&#x27;);
      const slides = Array.from(root.querySelectorAll(&#x27;.slide&#x27;));
      const previous = root.querySelector(&#x27;.previous&#x27;);
      const following = root.querySelector(&#x27;.following&#x27;);
      const dotsContainer = root.querySelector(&#x27;.dots&#x27;);
      const progress = root.querySelector(&#x27;.progress-fill&#x27;);
      const counter = root.querySelector(&#x27;.counter&#x27;);
      const currentLabel = root.querySelector(&#x27;.current-label&#x27;);
      let current = 0;

      const dots = slides.map((slide, index) =&gt; {
        const dot = document.createElement(&#x27;button&#x27;);
        dot.type = &#x27;button&#x27;;
        dot.className = &#x27;dot&#x27;;
        dot.setAttribute(&#x27;aria-label&#x27;, `Go to slide ${index + 1}: ${slide.dataset.title}`);
        dot.addEventListener(&#x27;click&#x27;, () =&gt; show(index));
        dotsContainer.appendChild(dot);
        return dot;
      });

      function show(index) {
        current = Math.max(0, Math.min(slides.length - 1, index));
        slides.forEach((slide, slideIndex) =&gt; { slide.hidden = slideIndex !== current; });
        dots.forEach((dot, dotIndex) =&gt; {
          if (dotIndex === current) dot.setAttribute(&#x27;aria-current&#x27;, &#x27;true&#x27;);
          else dot.removeAttribute(&#x27;aria-current&#x27;);
        });
        previous.disabled = current === 0;
        following.disabled = current === slides.length - 1;
        counter.textContent = `${current + 1} / ${slides.length}`;
        currentLabel.textContent = `${slides[current].dataset.title} · ${slides[current].dataset.year}`;
        progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      }

      previous.addEventListener(&#x27;click&#x27;, () =&gt; show(current - 1));
      following.addEventListener(&#x27;click&#x27;, () =&gt; show(current + 1));
      root.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;ArrowLeft&#x27;) show(current - 1);
        if (event.key === &#x27;ArrowRight&#x27;) show(current + 1);
      });

      const xorFigure = root.querySelector(&#x27;.xor-figure&#x27;);
      const xorStatus = root.querySelector(&#x27;.xor-status&#x27;);
      root.querySelectorAll(&#x27;.xor-mode&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const mode = button.dataset.mode;
          xorFigure.dataset.mode = mode;
          root.querySelectorAll(&#x27;.xor-mode&#x27;).forEach((candidate) =&gt; {
            const selected = candidate.dataset.mode === mode;
            candidate.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
            candidate.classList.toggle(&#x27;btn-primary&#x27;, selected);
          });
          xorStatus.textContent = mode === &#x27;single&#x27;
            ? &#x27;One boundary always leaves at least one point on the wrong side.&#x27;
            : &#x27;Two hidden units create two boundaries; the output combines them into a nonlinear decision region.&#x27;;
        });
      });

      show(0);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
